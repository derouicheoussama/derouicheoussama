    <text x="852" y="104" font-size="15" fill="#9FB0C9">Next.js · React · Supabase — multi-tenant,</text>
    <text x="852" y="126" font-size="15" fill="#9FB0C9">paiements, dashboards, sites sur mesure</text>
    <text x="852" y="156" font-size="14" font-weight="600" fill="#34D399">Oran (Algérie) &amp; France — à distance</text>
