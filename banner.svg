<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Derouiche Oussama — Infinity Coder, Oran, Algérie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A111F"/>
      <stop offset="1" stop-color="#121C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5FE0"/>
      <stop offset="1" stop-color="#4CC2FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2A3A5C"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="620" y="0" width="580" height="236" fill="url(#dots)" opacity="0.55"/>
  <circle cx="1090" cy="60" r="170" fill="#2F5FE0" opacity="0.10"/>
  <circle cx="960" cy="270" r="120" fill="#4CC2FF" opacity="0.07"/>
  <rect x="0" y="294" width="1200" height="6" fill="url(#accent)"/>

  <rect x="60" y="56" width="72" height="72" rx="18" fill="url(#accent)"/>
  <text x="96" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">∞</text>

  <text x="156" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-0.5" fill="#F3F6FC">Derouiche Oussama</text>
  <text x="158" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#7FB2FF">∞ Infinity Coder — Oran, Algérie</text>
  <text x="60" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#B9C4D6">Logiciels desktop · plugins WordPress premium · plateformes web SaaS — conçus, développés et maintenus seul.</text>
  <text x="60" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#B9C4D6">Produits vendus avec licence et support direct — données 100 % locales chez les clients.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600">
    <rect x="60" y="228" width="102" height="32" rx="16" fill="url(#accent)"/>
    <text x="111" y="249" text-anchor="middle" fill="#FFFFFF">FactSpeed</text>
    <rect x="172" y="228" width="148" height="32" rx="16" fill="none" stroke="#2A3A5C"/>
    <text x="246" y="249" text-anchor="middle" fill="#B9C4D6">LoginFennec Pro</text>
    <rect x="330" y="228" width="126" height="32" rx="16" fill="none" stroke="#2A3A5C"/>
    <text x="393" y="249" text-anchor="middle" fill="#B9C4D6">MigrateX Pro</text>
    <rect x="466" y="228" width="120" height="32" rx="16" fill="none" stroke="#2A3A5C"/>
    <text x="526" y="249" text-anchor="middle" fill="#B9C4D6">InfinityCod</text>
    <rect x="596" y="228" width="112" height="32" rx="16" fill="none" stroke="#2A3A5C"/>
    <text x="652" y="249" text-anchor="middle" fill="#B9C4D6">RentExpert</text>
  </g>
